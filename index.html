<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F5C46">
<meta name="description" content="Turni, riposi e mansioni del bar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni Bar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Turni Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app a una colonna per telefono, barra superiore con titolo, contenuto scorrevole, navigazione fissa in basso */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#13221C; --muted:#5A6A63; --line:#D4DDD8;
  --accent:#0F5C46; --accent-soft:#DCEBE4; --accent-ink:#FFFFFF; --brass:#A87A22; --brass-soft:#F4E9D2;
  --danger:#B3362F; --danger-soft:#F7E1DF; --ok:#2E7D4F;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#16211C; --surface-2:#1B2822; --ink:#E5EDE9; --muted:#93A39B; --line:#273630;
  --accent:#4DB38D; --accent-soft:#1D3A2F; --accent-ink:#06140F; --brass:#D9A84A; --brass-soft:#3A2F1A;
  --danger:#E8746B; --danger-soft:#3D2120; --ok:#5CC98B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#16211C; --surface-2:#1B2822; --ink:#E5EDE9; --muted:#93A39B; --line:#273630;
  --accent:#4DB38D; --accent-soft:#1D3A2F; --accent-ink:#06140F; --brass:#D9A84A; --brass-soft:#3A2F1A;
  --danger:#E8746B; --danger-soft:#3D2120; --ok:#5CC98B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:560px}
.nav button{border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.banner{background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 35%,transparent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.banner p{margin:0;font-size:14px}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}

.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weekbar h2{flex:1;margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;text-align:center}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.toolbar{display:flex;gap:8px;justify-content:center;margin:-4px 0 14px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}

.day{margin-bottom:14px}
.day-h{display:flex;align-items:baseline;gap:8px;padding:4px 2px 6px}
.day-h .dn{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:capitalize}
.day-h .meta{color:var(--muted);font-size:13px;flex:1}
.day.today .day-h .dn{color:var(--accent)}
.today-pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:99px}
.day-info{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px}
.tag.rest{background:var(--brass-soft);color:var(--brass)}
.tag.gap{background:var(--danger-soft);color:var(--danger)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shift{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.shift:first-child{border-top:0}
.per{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:5px 14px;border-top:1px solid var(--line)}
.per:first-child{border-top:0}
.per+.shift{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.shift .who{flex:1;min-width:0}
.shift .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift .who span{font-size:12.5px;color:var(--muted)}
.shift .who .warn{color:var(--danger);font-weight:600}
.time{font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.time small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.empty-day{padding:12px 14px;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:14px}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;border:0;background:var(--accent);color:var(--accent-ink);
  border-radius:16px;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab svg{width:18px;height:18px}

.group{margin-bottom:16px}
.group-h{display:flex;align-items:center;gap:10px;padding:0 2px 6px}
.group-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px;flex:1}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 2px 8px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.task.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done .check svg{opacity:1}
.task .t{flex:1;min-width:0}
.task.done .t b{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .t b{display:block;font-weight:600}
.task .t span{font-size:12.5px;color:var(--muted)}
.task .more{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px}
.task .more svg{width:18px;height:18px}

.onshift{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500}

.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.person:first-child{border-top:0}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:15px}
.person .who{flex:1;min-width:0}
.person .who b{display:block;font-weight:600}
.person .who span{font-size:12.5px;color:var(--muted)}
.rolechips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.rolechips i{font-style:normal;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.hrs{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;flex:none}
.hrs b{display:block;color:var(--ink);font-size:14px}
.hrs b.over{color:var(--danger)}
.section-t{font-family:var(--f-display);font-weight:600;font-size:16px;margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
.section-t span{flex:1}
.note{color:var(--muted);font-size:13px;margin:6px 2px 0}
.slot{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.slot:first-child{border-top:0}
.slot .who{flex:1;min-width:0}
.slot .who b{display:block;font-weight:600}
.slot .who span{font-size:12.5px;color:var(--muted)}

/* Foglio dal basso */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,12,9,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .2s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0 0 4px}
.sheet h4{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 8px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 0 -4px}
.field>label,.field>.lbl,.lblrow .lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
.field textarea{min-height:110px;font-family:var(--f-mono);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.presets button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}
.presets button span{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-left:4px;font-size:12px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--muted)}
.toggles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toggles.rest button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--surface)}
.toggles.days button{min-width:40px;padding-inline:0}
.addrole{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:600}
.rolelist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.redit{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.redit:first-child{border-top:0}
.redit span{flex:1;min-width:0;font-weight:600}
.redit small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.rinput{display:flex;gap:6px;align-items:center}
.rinput input{flex:1;min-width:0;border:1px solid var(--accent);background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:16px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:9;width:calc(100% - 32px);max-width:528px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:10px 12px;display:flex;align-items:center;gap:8px}
.selbar span{flex:1;font-weight:600;font-size:14px}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.box svg{width:14px;height:14px;opacity:0}
.shift[aria-pressed="true"]{background:var(--accent-soft)}
.shift[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shift[aria-pressed="true"] .box svg{opacity:1}
.sharerow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sharebtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);text-align:center}
.sharebtn svg{width:24px;height:24px}
.sharebtn.wa svg{color:#25A35A}
.sharebtn.pdf svg{color:var(--danger)}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-weight:600}
.prow .who span{font-size:12.5px;color:var(--muted)}
.walink{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;background:#25A35A;color:#fff;font-weight:700;font-size:13px;text-decoration:none;flex:none}
.walink svg{width:16px;height:16px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:10px;border:3px solid transparent;padding:0}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.need{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.need:first-child{border-top:0}
.need span{flex:1;font-weight:500}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:600;line-height:1}
.stepper output{width:28px;text-align:center;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.restgrid-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.restgrid{border-collapse:separate;border-spacing:3px;width:100%}
.restgrid th{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:0 0 2px;line-height:1.2}
.restgrid th b{display:block;font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.restgrid td.n{font-size:13px;font-weight:600;white-space:nowrap;padding-right:4px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.restgrid td button{width:100%;min-width:32px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);padding:0}
.restgrid td button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--surface)}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.summary div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.summary div span:last-child{color:var(--muted);text-align:right}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--danger);background:var(--danger-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;margin-bottom:10px}
.info{color:var(--brass);background:var(--brass-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand" id="title">Turni<small id="subtitle"></small></h1>
    <button class="btn sm" type="button" id="install" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Installa</button>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" type="button"></button>
<nav class="nav" aria-label="Sezioni">
  <div class="nav-in">
    <button type="button" data-tab="turni" id="tab-turni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Turni</button>
    <button type="button" data-tab="mansioni" id="tab-mansioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>Mansioni</button>
    <button type="button" data-tab="staff" id="tab-staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.6c2.3.2 4 1.8 4.5 4.4"/></svg>Staff</button>
  </div>
</nav>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="selbar" id="selbar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";
var KEY = "turni-bar-v1";
var DEFAULT_ROLES = ["Responsabile","Barista","Cameriere/a","Cassa","Gelati","Stuzzichini","Extra"];
var PERIODS = ["Mattina","Sera"];
var GROUPS = ["Apertura","Durante il servizio","Chiusura","Pulizie settimanali"];
var COLORS = ["#2F8F6F","#3B7DD8","#8A63D2","#D0663F","#C9932B","#C84E86","#4F8A35","#3A9AA8"];
var PRESETS = [["Mattina","06:30","14:30"],["Sera","14:30","22:30"],["Rinforzo","19:00","00:00"]];

/* ---------- utilità ---------- */
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function pad(n){ return (n<10?"0":"") + n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parse(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); return addDays(x,-wd(x)); }
function wd(d){ return (d.getDay()+6)%7; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function mins(t){ var p=t.split(":"); return (+p[0])*60 + (+p[1]); }
function dur(s,e){ var a=mins(s), b=mins(e); if(b<=a) b+=1440; return b-a; }
function fmtH(m){ return String(Math.round(m/60*100)/100).replace(".",",") + " h"; }
function dayLabel(d){ return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()]; }
function staffById(id){ for(var i=0;i<state.staff.length;i++) if(state.staff[i].id===id) return state.staff[i]; return null; }
function initials(n){ return n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||"";}).join("").toUpperCase(); }
function interval(s){ var a=mins(s.start), b=mins(s.end); if(b<=a) b+=1440; return [a,b]; }
function firstName(p){ return p.name.split(" ")[0]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function roleOf(s){ if(s.role) return s.role; var p=staffById(s.staffId); return p&&p.roles[0]||""; }
function daysText(days){
  if(days.length===7) return "tutti i giorni";
  if(!days.length) return "nessun giorno";
  var s=days.slice().sort(); var run=true; for(var i=1;i<s.length;i++) if(s[i]!==s[i-1]+1) run=false;
  return (run && s.length>2) ? WD_SHORT[s[0]]+"–"+WD_SHORT[s[s.length-1]] : s.map(function(d){return WD_SHORT[d];}).join(", ");
}
function periodOf(start){ return mins(start) < 13*60 ? "Mattina" : "Sera"; }
function periodsText(ps){ return ps.length===2 ? "Mattina e sera" : ps.length ? "Solo "+ps[0].toLowerCase() : "Nessun turno"; }
function needsText(n){ return state.roles.filter(function(r){return n[r];}).map(function(r){return n[r]+" "+r;}).join(" · ") || "nessuno"; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ var s=JSON.parse(raw); if(s && s.staff){ if(s.sample && s.v!==4) return seed(); return normalize(s); } } }catch(e){}
  return seed();
}
function defaultSlots(){
  var all=[0,1,2,3,4,5,6];
  return [
    {id:uid(),name:"Mattina",start:"06:30",end:"14:30",days:all,needs:{"Barista":1,"Cassa":1}},
    {id:uid(),name:"Sera",start:"14:30",end:"22:30",days:all,needs:{"Barista":1,"Cameriere/a":1}},
    {id:uid(),name:"Aperitivo",start:"18:00",end:"22:30",days:[4,5],needs:{"Stuzzichini":1}},
    {id:uid(),name:"Rinforzo weekend",start:"19:00",end:"00:00",days:[4,5],needs:{"Extra":1}}
  ];
}
function normalize(s){
  s.staff=(s.staff||[]).map(function(p){
    if(!p.roles) p.roles = p.role ? [p.role] : ["Barista"];
    delete p.role;
    if(!p.restDays) p.restDays=[];
    if(!p.maxHours) p.maxHours=40;
    if(!p.periods) p.periods=PERIODS.slice();
    return p;
  });
  s.shifts=s.shifts||[]; s.tasks=s.tasks||[]; s.done=s.done||{};
  s.dayoff=s.dayoff||{}; s.slots=s.slots||defaultSlots();
  if(!s.roles){
    s.roles=DEFAULT_ROLES.slice();
    s.staff.forEach(function(p){ p.roles.forEach(function(r){ if(s.roles.indexOf(r)<0) s.roles.push(r); }); });
    s.slots.forEach(function(sl){ Object.keys(sl.needs).forEach(function(r){ if(s.roles.indexOf(r)<0) s.roles.push(r); }); });
  }
  return s;
}

/* ---------- riposi ---------- */
function isOff(pid,date){
  var o=state.dayoff[date]; if(o && Object.prototype.hasOwnProperty.call(o,pid)) return !!o[pid];
  var p=staffById(pid); return !!(p && p.restDays.indexOf(wd(parse(date)))>=0);
}
function setOff(pid,date,val){
  var p=staffById(pid), fixed=!!(p && p.restDays.indexOf(wd(parse(date)))>=0);
  var o=state.dayoff[date]||(state.dayoff[date]={});
  if(val===fixed) delete o[pid]; else o[pid]=val;
  if(!Object.keys(o).length) delete state.dayoff[date];
}
function offOn(date){ return state.staff.filter(function(p){return isOff(p.id,date);}); }

/* ---------- generatore ---------- */
function generateWeek(ws){
  var from=ymd(ws), to=ymd(addDays(ws,6));
  state.shifts=state.shifts.filter(function(s){return !(s.date>=from && s.date<=to);});
  var load={}; state.staff.forEach(function(p){load[p.id]=0;});
  var order=shuffle(state.staff.slice()), made=0, warned=0;

  function shiftsOf(pid,date){ return state.shifts.filter(function(s){return s.staffId===pid && s.date===date;}); }
  function restOK(pid,date,start,end){
    var a=mins(start), b=a+dur(start,end);
    var prev=shiftsOf(pid,ymd(addDays(parse(date),-1)));
    for(var i=0;i<prev.length;i++){ var e=interval(prev[i])[1]-1440; if(a-e<MIN_REST) return false; }
    var next=shiftsOf(pid,ymd(addDays(parse(date),1)));
    for(var j=0;j<next.length;j++){ var s2=interval(next[j])[0]+1440; if(s2-b<MIN_REST) return false; }
    return true;
  }
  function pick(sl,role,date,strict){
    var len=dur(sl.start,sl.end);
    var c=order.filter(function(p){
      if(p.roles.indexOf(role)<0 || p.periods.indexOf(periodOf(sl.start))<0 || isOff(p.id,date) || shiftsOf(p.id,date).length) return false;
      if(strict) return load[p.id]+len<=p.maxHours*60 && restOK(p.id,date,sl.start,sl.end);
      return true;
    });
    c.sort(function(x,y){ return (load[x.id]/x.maxHours)-(load[y.id]/y.maxHours) || x.roles.length-y.roles.length; });
    return c[0]||null;
  }
  for(var i=0;i<7;i++){
    var ds=ymd(addDays(ws,i)), needs=[];
    state.slots.forEach(function(sl){
      if(sl.days.indexOf(i)<0) return;
      state.roles.forEach(function(r){ for(var k=0;k<(sl.needs[r]||0);k++) needs.push({sl:sl,role:r}); });
    });
    // prima i ruoli con meno persone disponibili
    needs.forEach(function(n){ n.cand=state.staff.filter(function(p){return p.roles.indexOf(n.role)>=0 && p.periods.indexOf(periodOf(n.sl.start))>=0 && !isOff(p.id,ds);}).length; });
    needs.sort(function(a,b){return a.cand-b.cand;});
    needs.forEach(function(n){
      var p=pick(n.sl,n.role,ds,true), warn="";
      if(!p){
        p=pick(n.sl,n.role,ds,false);
        if(!p) return;
        var reasons=[];
        if(load[p.id]+dur(n.sl.start,n.sl.end)>p.maxHours*60) reasons.push("supera le ore max");
        if(!restOK(p.id,ds,n.sl.start,n.sl.end)) reasons.push("meno di 11 h di riposo");
        warn=reasons.join(", "); warned++;
      }
      state.shifts.push({id:uid(),staffId:p.id,date:ds,start:n.sl.start,end:n.sl.end,role:n.role,note:"",warn:warn});
      load[p.id]+=dur(n.sl.start,n.sl.end); made++;
    });
  }
  return {made:made,warned:warned,gaps:coverage(ws).reduce(function(a,g){return a+g.miss;},0)};
}
function coverage(ws){
  var gaps=[];
  for(var i=0;i<7;i++){
    var ds=ymd(addDays(ws,i));
    state.slots.forEach(function(sl){
      if(sl.days.indexOf(i)<0) return;
      state.roles.forEach(function(r){
        var need=sl.needs[r]||0; if(!need) return;
        var have=state.shifts.filter(function(s){return s.date===ds && roleOf(s)===r && s.start===sl.start && s.end===sl.end;}).length;
        if(have<need) gaps.push({date:ds,slot:sl,role:r,miss:need-have});
      });
    });
  }
  return gaps;
}

/* ---------- TURNI ---------- */
function weekRangeLabel(ws){
  var a=ws, b=addDays(a,6);
  return a.getDate()+(a.getMonth()!==b.getMonth()?" "+MONTHS[a.getMonth()]:"")+" – "+b.getDate()+" "+MONTHS[b.getMonth()]+" "+b.getFullYear();
}
function shiftsOn(date){ return state.shifts.filter(function(s){return s.date===date;}).sort(function(x,y){return mins(x.start)-mins(y.start);}); }

function renderTurni(){
  var total=0, count=0, today=ymd(new Date()), out="", gaps=coverage(ui.weekStart);
  out+='<div class="weekbar"><button class="icon-btn" type="button" id="w-prev" aria-label="Settimana precedente">'+ICON.left+'</button><h2>'+weekRangeLabel(ui.weekStart)+'</h2><button class="icon-btn" type="button" id="w-next" aria-label="Settimana successiva">'+ICON.right+'</button></div>';
  var isThis = ymd(ui.weekStart)===ymd(mondayOf(new Date()));
  var weekShifts=state.shifts.filter(function(s){return s.date>=ymd(ui.weekStart) && s.date<=ymd(addDays(ui.weekStart,6));});
  if(ui.select){
    var allSel=weekShifts.length && weekShifts.every(function(s){return ui.select.has(s.id);});
    out+='<div class="toolbar"><span class="note" style="margin:0;align-self:center">Tocca i turni da eliminare</span>'+
      (weekShifts.length?'<button class="btn sm" type="button" id="w-selall">'+(allSel?"Deseleziona settimana":"Seleziona tutta la settimana")+'</button>':'')+'</div>';
  } else {
    out+='<div class="toolbar"><button class="btn sm primary" type="button" id="w-gen">'+ICON.spark+'Genera turni</button>'+
      '<button class="btn sm" type="button" id="w-copy">Copia sett. precedente</button>'+
      (weekShifts.length?'<button class="btn sm" type="button" id="w-share">'+ICON.share+'Invia turni</button><button class="btn sm" type="button" id="w-sel">Elimina turni</button>':'')+
      (isThis?'':'<button class="btn sm" type="button" id="w-today">Oggi</button>')+'</div>';
  }
  for(var i=0;i<7;i++){
    var d=addDays(ui.weekStart,i), ds=ymd(d), list=shiftsOn(ds), off=offOn(ds);
    var dg=gaps.filter(function(g){return g.date===ds;});
    var mm=list.reduce(function(a,s){return a+dur(s.start,s.end);},0); total+=mm; count+=list.length;
    out+='<section class="day'+(ds===today?' today':'')+'"><div class="day-h"><span class="dn">'+dayLabel(d)+'</span>'+(ds===today?'<span class="today-pill">Oggi</span>':'')+
      '<span class="meta">'+(list.length? list.length+(list.length===1?" turno":" turni")+" · "+fmtH(mm):"")+'</span>'+
      (ui.select ? (list.length?'<button class="btn ghost sm" type="button" data-selday="'+ds+'">'+(list.every(function(s){return ui.select.has(s.id);})?"Nessuno":"Tutti")+'</button>':'')
        : '<button class="btn ghost sm" type="button" data-add="'+ds+'">+ Aggiungi</button>')+'</div>';
    if(off.length || (dg.length && list.length)){
      out+='<div class="day-info">'+(off.length?'<span class="tag rest">Riposo: '+off.map(function(p){return esc(firstName(p));}).join(", ")+'</span>':'')+

var DAY_FULL=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
function waNumber(ph){

  if(d.indexOf("+")===0) d=d.slice(1); else if(d.indexOf("00")===0) d=d.slice(2); else if(/^3\d{8,9}$/.test(d)) d="39"+d;

function hexRgb(h){ var n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function buildPdf(ws){
  var J=window.jspdf && window.jspdf.jsPDF; if(!J) throw new Error("jsPDF non caricato");
  var doc=new J({orientation:"landscape",unit:"mm",format:"a4"});
  var W=297, M=10, nameW=40, totW=16, dayW=(W-2*M-nameW-totW)/7, y=M;
  var green=[15,92,70], ink=[19,34,28], muted=[90,106,99], line=[212,221,216], restBg=[244,233,210], brass=[168,122,34];
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor.apply(doc,ink);
  doc.text("Turni settimana "+weekRangeLabel(ws).replace("–","-"), M, y+6);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor.apply(doc,muted);
  doc.text("Creato il "+new Date().toLocaleDateString("it-IT")+" alle "+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}), W-M, y+6, {align:"right"});
  y+=12;
  // intestazione
  doc.setFillColor.apply(doc,green); doc.rect(M,y,W-2*M,10,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(9.5);
  doc.text("Persona", M+3, y+6.5);
  for(var i=0;i<7;i++){ var d=addDays(ws,i); doc.text(DAY_FULL[i]+" "+d.getDate(), M+nameW+dayW*i+dayW/2, y+6.5, {align:"center"}); }
  doc.text("Ore", W-M-totW/2, y+6.5, {align:"center"});
  y+=10;
  var people=state.staff.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  people.forEach(function(p, idx){
    var cells=[], maxL=1, tot=0;
    for(var i=0;i<7;i++){
      var ds=ymd(addDays(ws,i)), mine=shiftsOn(ds).filter(function(s){return s.staffId===p.id;});
      mine.forEach(function(s){ tot+=dur(s.start,s.end); });
      cells.push({off:isOff(p.id,ds)&&!mine.length, shifts:mine}); maxL=Math.max(maxL,mine.length);
    }
    var h=Math.max(13, 4+maxL*9);
    if(y+h>200){ doc.addPage(); y=M; }
    if(idx%2){ doc.setFillColor(245,248,246); doc.rect(M,y,W-2*M,h,"F"); }
    doc.setFillColor.apply(doc,hexRgb(p.color)); doc.circle(M+4,y+5.2,1.6,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor.apply(doc,ink);
    doc.text(doc.splitTextToSize(p.name,nameW-9)[0], M+7.5, y+6.2);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor.apply(doc,muted);
    doc.text(doc.splitTextToSize(p.roles.join(", "),nameW-9).slice(0,2), M+7.5, y+10);
    cells.forEach(function(c,i){
      var x=M+nameW+dayW*i;
      if(c.off){ doc.setFillColor.apply(doc,restBg); doc.roundedRect(x+1.5,y+2,dayW-3,h-4,1.5,1.5,"F");
        doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor.apply(doc,brass); doc.text("RIPOSO", x+dayW/2, y+h/2+1.2, {align:"center"}); return; }
      c.shifts.forEach(function(s,k){
        var yy=y+6+k*9;
        doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor.apply(doc,ink); doc.text(s.start+"-"+s.end, x+dayW/2, yy, {align:"center"});
        doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor.apply(doc,muted); doc.text(doc.splitTextToSize(roleOf(s),dayW-3)[0], x+dayW/2, yy+3.6, {align:"center"});
      });
    });
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor.apply(doc,ink);
    doc.text(fmtH(tot), W-M-totW/2, y+h/2+1.2, {align:"center"});
    y+=h; doc.setDrawColor.apply(doc,line); doc.setLineWidth(0.2); doc.line(M,y,W-M,y);
  });
  for(var c=0;c<=7;c++){ var lx=M+nameW+dayW*c; doc.setDrawColor.apply(doc,line); doc.line(lx,M+22,lx,y); }
  var gaps=coverage(ws);
  if(gaps.length && state.shifts.some(function(s){return s.date>=ymd(ws) && s.date<=ymd(addDays(ws,6));})){
    y+=7; if(y>200){ doc.addPage(); y=M+5; }
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(179,54,47);
    var g=gaps.map(function(x){ return WD_SHORT[wd(parse(x.date))]+" "+x.slot.name+" "+x.role+(x.miss>1?" x"+x.miss:""); }).join(" · ");
    doc.text(doc.splitTextToSize("Posizioni scoperte: "+g, W-2*M), M, y);
  }
  return doc;
}
function sharePdf(ws){

}

function copyWeek(){
  var prevStart=addDays(ui.weekStart,-7), from=ymd(prevStart), to=ymd(addDays(prevStart,6));
  var src=state.shifts.filter(function(s){return s.date>=from && s.date<=to;});

  var curFrom=ymd(ui.weekStart), curTo=ymd(addDays(ui.weekStart,6));
  var existing=state.shifts.filter(function(s){return s.date>=curFrom && s.date<=curTo;}).length;
  function doCopy(replace){
    if(replace) state.shifts=state.shifts.filter(function(s){return !(s.date>=curFrom && s.date<=curTo);});
    var skipped=0;
    src.forEach(function(s){ var nd=ymd(addDays(parse(s.date),7)); if(isOff(s.staffId,nd)){ skipped++; return; }
      state.shifts.push({id:uid(),staffId:s.staffId,date:nd,start:s.start,end:s.end,role:roleOf(s),note:s.note,warn:""}); });
    save(); closeSheet(); render(); toast((src.length-skipped)+" turni copiati"+(skipped?" · "+skipped+" saltati per riposo":""));
  }
  openSheet('<h3>Copia settimana precedente</h3><p class="sub">'+src.length+' turni dalla settimana '+weekRangeLabel(prevStart)+'. Chi è di riposo questa settimana viene saltato.'+
    (existing?' Questa settimana ha già '+existing+' turni.':'')+'</p><div class="actions"><button class="btn" type="button" id="c-no">Annulla</button><div class="right">'+
    (existing?'<button class="btn" type="button" id="c-add">Aggiungi</button><button class="btn primary" type="button" id="c-rep">Sostituisci</button>':'<button class="btn primary" type="button" id="c-add">Copia</button>')+'</div></div>',function(s){
    s.querySelector("#c-no").onclick=closeSheet;
    s.querySelector("#c-add").onclick=function(){doCopy(false);};
    var r=s.querySelector("#c-rep"); if(r) r.onclick=function(){doCopy(true);};
  });
}

}

function roleError(v,old){
  if(!v) return "Scrivi il nome del ruolo.";
  if(state.roles.some(function(r){return r!==old && r.toLowerCase()===v.toLowerCase();})) return "Esiste già un ruolo con questo nome.";
  return "";
}
function renameRole(name,v){
  if(v===name) return;
  state.roles=state.roles.map(function(r){return r===name?v:r;});
  state.staff.forEach(function(p){ p.roles=p.roles.map(function(r){return r===name?v:r;}); });
  state.slots.forEach(function(sl){ if(sl.needs[name]){ sl.needs[v]=sl.needs[name]; delete sl.needs[name]; } });
  state.shifts.forEach(function(sh){ if(sh.role===name) sh.role=v; });
}
function deleteRole(name){
  state.roles=state.roles.filter(function(r){return r!==name;});
  state.staff.forEach(function(p){ p.roles=p.roles.filter(function(r){return r!==name;}); });
  state.slots.forEach(function(sl){ delete sl.needs[name]; });
}
function roleForm(name){
  var used=name? state.staff.filter(function(p){return p.roles.indexOf(name)>=0;}).length : 0;
  openSheet('<h3>'+(name?"Modifica ruolo":"Nuovo ruolo")+'</h3><p class="sub">'+(name?(used?used+(used===1?" persona ha":" persone hanno")+" questo ruolo. Il nuovo nome viene aggiornato ovunque.":"Nessuno ha ancora questo ruolo."):"es. Cassa, Gelati, Stuzzichini, Sala, Dehors")+'</p><div id="ro-err" class="err" hidden></div>'+
    '<div class="field"><label for="ro-name">Nome del ruolo</label><input id="ro-name" maxlength="24" autocomplete="off" value="'+esc(name||"")+'"></div>'+
    '<div class="actions">'+(name?'<button class="btn danger" type="button" id="ro-del">Elimina</button>':'<span></span>')+'<div class="right"><button class="btn" type="button" id="ro-cancel">Annulla</button><button class="btn primary" type="button" id="ro-save">Salva</button></div></div>',
  function(s){
    s.querySelector("#ro-cancel").onclick=closeSheet;
    if(name) armDelete(s.querySelector("#ro-del"),function(){
      deleteRole(name); save(); closeSheet(); render(); toast("Ruolo eliminato");
    });
    s.querySelector("#ro-save").onclick=function(){
      var v=s.querySelector("#ro-name").value.trim(), e=s.querySelector("#ro-err");
      var er=roleError(v,name); if(er){ e.textContent=er; e.hidden=false; return; }
      if(name) renameRole(name,v); else state.roles.push(v);
      save(); closeSheet(); render(); toast(name?"Ruolo aggiornato":"Ruolo "+v+" aggiunto");
    };
  });
}
function slotForm(id){
  var sl= id? state.slots.find(function(x){return x.id===id;}) : {name:"",start:"06:30",end:"14:30",days:[0,1,2,3,4,5,6],needs:{"Barista":1}};
  var needs=Object.assign({},sl.needs);
  openSheet('<h3>'+(id?"Modifica fascia":"Nuova fascia")+'</h3><p class="sub"></p><div id="s-err" class="err" hidden></div>'+
    '<div class="field"><label for="s-name">Nome</label><input id="s-name" maxlength="24" placeholder="es. Mattina, Aperitivo" value="'+esc(sl.name)+'"></div>'+
    '<div class="two"><div class="field"><label for="s-start">Inizio</label><input type="time" id="s-start" value="'+sl.start+'"></div><div class="field"><label for="s-end">Fine</label><input type="time" id="s-end" value="'+sl.end+'"></div></div>'+
    '<div class="field"><span class="lbl">Giorni</span>'+dayToggles("sdays",sl.days)+'</div>'+
    '<div class="field"><span class="lbl">Persone necessarie</span><div>'+state.roles.map(function(r){return '<div class="need"><span>'+esc(r)+'</span><div class="stepper"><button type="button" data-r="'+esc(r)+'" data-d="-1" aria-label="Meno">−</button><output data-o="'+esc(r)+'">'+(needs[r]||0)+'</output><button type="button" data-r="'+esc(r)+'" data-d="1" aria-label="Più">+</button></div></div>';}).join("")+'</div></div>'+
    '<div class="actions">'+(id?'<button class="btn danger" type="button" id="s-del">Elimina</button>':'<span></span>')+'<div class="right"><button class="btn" type="button" id="s-cancel">Annulla</button><button class="btn primary" type="button" id="s-save">Salva</button></div></div>',
  function(s){
    bindToggles(s,".sdays");
    s.querySelectorAll(".stepper button").forEach(function(b){ b.onclick=function(){ var r=b.dataset.r; needs[r]=Math.max(0,Math.min(9,(needs[r]||0)+(+b.dataset.d)));
      Array.prototype.forEach.call(s.querySelectorAll("output"),function(o){ if(o.dataset.o===r) o.textContent=needs[r]; }); }; });
    s.querySelector("#s-cancel").onclick=closeSheet;
    if(id) armDelete(s.querySelector("#s-del"),function(){ state.slots=state.slots.filter(function(x){return x.id!==id;}); save(); closeSheet(); render(); toast("Fascia eliminata"); });
    s.querySelector("#s-save").onclick=function(){
      var e=s.querySelector("#s-err"); function fail(m){ e.textContent=m; e.hidden=false; }
      Object.keys(needs).forEach(function(k){ if(!needs[k]) delete needs[k]; });
      var v={name:s.querySelector("#s-name").value.trim(),start:s.querySelector("#s-start").value,end:s.querySelector("#s-end").value,days:pressedValues(s,".sdays").map(Number),needs:needs};
      if(!v.name) return fail("Dai un nome alla fascia.");
      if(!v.start||!v.end||v.start===v.end) return fail("Controlla inizio e fine.");
      if(!v.days.length) return fail("Scegli almeno un giorno.");
      if(!Object.keys(needs).length) return fail("Indica almeno una persona necessaria.");
      if(id) Object.assign(sl,v); else state.slots.push(Object.assign({id:uid()},v));
      save(); closeSheet(); render(); toast(id?"Fascia aggiornata":"Fascia aggiunta");
    };
  });
}

save();
render();
})();
</script>
</body>
</html>
